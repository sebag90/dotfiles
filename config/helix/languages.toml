[[language]]
name = "python"
language-servers = [ "pyrefly" ]
formatter = { command = "ruff", args = ["format", "--stdin-filename", "file.py", "-"] }
auto-format = true

[language-server.pyrefly]
command = "pyrefly"
args = [ "lsp" ]

[language-server.pyrefly.config.pyrefly]
typeCheckingMode = "default"

[language-server.ruff]
command = "ruff"
args = ["server"]


[[language]]
name = "html"
formatter = { command = 'prettier', args = ["--parser", "html"] }
auto-format = true

[[language]]
name = "json"
formatter = { command = 'prettier', args = ["--parser", "json"] }
auto-format = true

[[language]]
name = "css"
formatter = { command = 'prettier', args = ["--parser", "css"] }
auto-format = true

[[language]]
name = "javascript"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "typescript"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "tsx"
formatter = { command = 'prettier', args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "markdown"
formatter = { command = 'prettier', args = ["--parser", "markdown"] }
auto-format = true
